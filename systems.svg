<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="850" height="330">
  <rect width="850" height="330" fill="#0b0c10"/>
  <rect x="0.5" y="0.5" width="849" height="329" fill="none" stroke="#26282e"/>

  <!-- header -->
  <text x="48" y="44" font-family="ui-monospace,'Fira Code',monospace" font-size="12.5" letter-spacing="3" fill="#8a8778">SYSTEMS — OWNED END-TO-END</text>
  <text x="802" y="44" font-family="ui-monospace,'Fira Code',monospace" font-size="12.5" letter-spacing="3" fill="#7d8590" text-anchor="end">01 — 03</text>
  <line x1="48" y1="58" x2="802" y2="58" stroke="#26282e"/>

  <!-- scanner: marker sweeping the header rule (rests at rule start until choreography begins) -->
  <rect x="0" y="55" width="10" height="6" fill="#e5484d" transform="translate(48 0)">
    <animateTransform attributeName="transform" type="translate" values="48 0;792 0;48 0" keyTimes="0;0.5;1" dur="10s" begin="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- column separators with traveling pulses -->
  <line x1="300" y1="84" x2="300" y2="300" stroke="#26282e"/>
  <line x1="558" y1="84" x2="558" y2="300" stroke="#26282e"/>
  <circle cx="300" cy="84" r="3.5" fill="#e5484d" opacity="0">
    <animateMotion dur="4s" begin="1.2s" repeatCount="indefinite" path="M 0 0 L 0 216"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="558" cy="84" r="3.5" fill="#e5484d" opacity="0">
    <animateMotion dur="4s" begin="3.2s" repeatCount="indefinite" path="M 0 0 L 0 216"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" begin="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- col 1: product systems -->
  <text x="48" y="100" font-family="ui-monospace,'Fira Code',monospace" font-size="13" fill="#e5484d">01</text>
  <!-- icon: app window with loading bar -->
  <g stroke="#e5484d" stroke-width="1.6" fill="none">
    <rect x="247" y="83" width="30" height="26" rx="2.5"/>
    <line x1="247" y1="90.5" x2="277" y2="90.5"/>
  </g>
  <circle cx="251.5" cy="86.7" r="1.4" fill="#e5484d"/>
  <line x1="256.5" y1="86.7" x2="271.5" y2="86.7" stroke="#e5484d" stroke-width="1.6" stroke-opacity="0.4" stroke-linecap="round"/>
  <line x1="251.5" y1="95.8" x2="272.5" y2="95.8" stroke="#8a8778" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="251.5" y1="100.2" x2="265.5" y2="100.2" stroke="#8a8778" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="251.5" y1="104.8" x2="272.5" y2="104.8" stroke="#e5484d" stroke-width="2" stroke-opacity="0.28" stroke-linecap="round"/>
  <line x1="251.5" y1="104.8" x2="272.5" y2="104.8" stroke="#e5484d" stroke-width="2" stroke-linecap="round" stroke-dasharray="21" stroke-dashoffset="21">
    <animate attributeName="stroke-dashoffset" values="21;0;0" keyTimes="0;0.72;1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
  </line>
  <text x="48" y="136" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ece9df">Product Systems</text>
  <line x1="48" y1="152" x2="276" y2="152" stroke="#26282e"/>
  <line x1="48" y1="152" x2="110" y2="152" stroke="#e5484d" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;166 0;0 0" keyTimes="0;0.5;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </line>
  <g font-family="ui-monospace,'Fira Code',monospace" font-size="12.5" fill="#a8a395">
    <text x="48" y="180">react 19 · next.js · vite</text>
    <text x="48" y="206">node · express · hono</text>
    <text x="48" y="232">stripe · mercado pago pix</text>
    <text x="48" y="258">postgres · prisma · drizzle</text>
    <text x="48" y="284">tailwind · framer motion</text>
  </g>

  <!-- col 2: ml & data -->
  <text x="316" y="100" font-family="ui-monospace,'Fira Code',monospace" font-size="13" fill="#e5484d">02</text>
  <!-- icon: neural net, signals flowing along edges, output pinging -->
  <g stroke="#e5484d" stroke-width="1.1" stroke-opacity="0.55" stroke-dasharray="3 3.6" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-13.2" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    <line x1="512" y1="87" x2="526" y2="82"/>
    <line x1="512" y1="87" x2="526" y2="96"/>
    <line x1="512" y1="87" x2="526" y2="110"/>
    <line x1="512" y1="105" x2="526" y2="82"/>
    <line x1="512" y1="105" x2="526" y2="96"/>
    <line x1="512" y1="105" x2="526" y2="110"/>
    <line x1="526" y1="82" x2="540" y2="96"/>
    <line x1="526" y1="96" x2="540" y2="96"/>
    <line x1="526" y1="110" x2="540" y2="96"/>
  </g>
  <g fill="#0b0c10" stroke="#e5484d" stroke-width="1.6">
    <circle cx="512" cy="87" r="2.8"/>
    <circle cx="512" cy="105" r="2.8"/>
    <circle cx="526" cy="82" r="2.8"/>
    <circle cx="526" cy="96" r="2.8"/>
    <circle cx="526" cy="110" r="2.8"/>
  </g>
  <g fill="#e5484d">
    <circle cx="512" cy="87" r="1.3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="512" cy="105" r="1.3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="526" cy="82" r="1.3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="526" cy="96" r="1.3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="526" cy="110" r="1.3">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="540" cy="96" r="3" fill="#e5484d"/>
  <circle cx="540" cy="96" r="3.4" fill="none" stroke="#e5484d" stroke-width="1.2" stroke-opacity="0">
    <animate attributeName="r" values="3.4;8.5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="316" y="136" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ece9df">ML &amp; Data</text>
  <line x1="316" y1="152" x2="534" y2="152" stroke="#26282e"/>
  <line x1="316" y1="152" x2="378" y2="152" stroke="#e5484d" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;156 0;0 0" keyTimes="0;0.5;1" dur="5s" begin="2.8s" repeatCount="indefinite"/>
  </line>
  <g font-family="ui-monospace,'Fira Code',monospace" font-size="12.5" fill="#a8a395">
    <text x="316" y="180">python · tensorflow lite</text>
    <text x="316" y="206">ocr → structured data</text>
    <text x="316" y="232">pandas · stats models</text>
    <text x="316" y="258">supabase · data apis</text>
    <text x="316" y="284">openai · ollama</text>
  </g>

  <!-- col 3: agents & machines -->
  <text x="574" y="100" font-family="ui-monospace,'Fira Code',monospace" font-size="13" fill="#e5484d">03</text>
  <!-- icon: robot head, antenna blinking, eyes glancing + blinking -->
  <g stroke="#e5484d" stroke-width="1.6" fill="none">
    <rect x="771" y="87" width="26" height="21" rx="4"/>
    <line x1="784" y1="87" x2="784" y2="80.5"/>
  </g>
  <circle cx="784" cy="78" r="1.9" fill="#e5484d">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <rect x="768" y="93.5" width="3" height="7" rx="1" fill="#e5484d"/>
  <rect x="797" y="93.5" width="3" height="7" rx="1" fill="#e5484d"/>
  <g fill="#e5484d">
    <animateTransform attributeName="transform" type="translate" values="0 0;1.6 0;1.6 0;-1.6 0;-1.6 0;0 0" keyTimes="0;0.2;0.45;0.65;0.9;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    <g transform="translate(778.2 96.5)">
      <rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="1.4">
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.44;0.5;0.56;1" dur="3.8s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(789.8 96.5)">
      <rect x="-2.6" y="-2.6" width="5.2" height="5.2" rx="1.4">
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.44;0.5;0.56;1" dur="3.8s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <line x1="780" y1="103" x2="788" y2="103" stroke="#e5484d" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <text x="574" y="136" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#ece9df">Agents &amp; Machines</text>
  <line x1="574" y1="152" x2="798" y2="152" stroke="#26282e"/>
  <line x1="574" y1="152" x2="636" y2="152" stroke="#e5484d" stroke-width="1.5">
    <animateTransform attributeName="transform" type="translate" values="0 0;162 0;0 0" keyTimes="0;0.5;1" dur="5s" begin="4.4s" repeatCount="indefinite"/>
  </line>
  <g font-family="ui-monospace,'Fira Code',monospace" font-size="12.5" fill="#a8a395">
    <text x="574" y="180">discord.py-self · fastapi</text>
    <text x="574" y="206">bullmq · redis workers</text>
    <text x="574" y="232">esp32-s3 · esp-now · ble</text>
    <text x="574" y="258">textual tui · pyinstaller</text>
    <text x="574" y="284">docker · github actions</text>
  </g>
</svg>
