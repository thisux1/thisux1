<svg id="static" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" width="360" height="226" role="img" aria-labelledby="title desc">
  <title id="title">Thiago Araújo</title>
  <desc id="desc">Systems engineer in São Paulo. End-to-end systems, from idea to reality.</desc>
  <style>
    text { fill: #ece9df; }
    .mono { font-family: monospace; font-size: 13px; fill: #cbc6ba; }
    .name { font-family: Georgia,serif; font-size: 46px; }
    @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    svg:target * { animation: none !important; }
    @media (prefers-reduced-motion: no-preference) {
      .name { animation: reveal .55s cubic-bezier(.22,1,.36,1) both; }
      .details { animation: reveal .5s .12s both; }
      .signal { animation: breathe 5s ease-in-out infinite; }
    }
  </style>
  <rect width="360" height="226" fill="#0b0c10"/>
  <path d="M16 38H344M16 190H344" stroke="#34363e"/>
  <circle class="signal" cx="20" cy="22" r="3" fill="#e5484d"/>
  <text class="mono" x="32" y="26" letter-spacing=".8">SYSTEMS ENGINEER</text>
  <text class="mono" x="344" y="26" text-anchor="end">SP · BR</text>
  <text class="name" x="14" y="92">Thiago <tspan fill="#e5484d" font-style="italic">Araújo</tspan></text>
  <path d="M159 103H310" stroke="#e5484d" stroke-width="2"/>
  <g class="details mono">
    <text x="16" y="136" font-size="16">End-to-end systems.</text>
    <text x="16" y="159">idea → architecture → interface</text>
    <text x="16" y="179">→ reality</text>
    <text x="16" y="214" font-size="12">PRODUCT · INTELLIGENCE · MACHINES</text>
  </g>
</svg>
