<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f" />
      <stop offset="100%" stop-color="#800c2a" />
    </linearGradient>
    <clipPath id="clip-prompt">
      <rect x="0" y="100" height="40" width="0">
        <animate attributeName="width" from="0" to="350" dur="2s" begin="4.3s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .neon-border {
      stroke: #ff2a5f;
      stroke-width: 1.5px;
      filter: url(#glow);
    }
    .grid-line {
      stroke: #ff2a5f;
      stroke-width: 0.5px;
      opacity: 0.08;
    }
    .term-text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .term-title {
      font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #ff2a5f;
      filter: url(#subtle-glow);
      letter-spacing: 1.5px;
    }
    .term-dim {
      fill: #6272a4;
    }
    .term-accent {
      fill: #ff2a5f;
    }
    .term-keyword {
      fill: #ff79c6;
    }
    .term-string {
      fill: #f1fa8c;
    }
    .cursor-blink {
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .line-1 { animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; animation-delay: 0.5s; }
    .line-2 { animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; animation-delay: 1.2s; }
    .line-3 { animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; animation-delay: 1.9s; }
    .line-4 { animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; animation-delay: 2.6s; }
    .line-5 { animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; animation-delay: 3.3s; }
    .line-prompt { animation: fadeIn 0.3s ease-in-out forwards; opacity: 0; animation-delay: 4.0s; }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <!-- Background Card -->
  <rect width="848" height="258" x="1" y="1" rx="8" fill="#090d13" stroke="#21262d" stroke-width="1" />
  
  <!-- Subtle Glowing Neon Top-Border/Accent -->
  <rect width="848" height="258" x="1" y="1" rx="8" fill="none" class="neon-border" opacity="0.3"/>
  <path d="M 1,40 L 849,40" stroke="#ff2a5f" stroke-width="1.5" opacity="0.4" />
  
  <!-- Terminal Controls -->
  <circle cx="20" cy="20" r="5" fill="#ff2a5f" opacity="0.8" />
  <circle cx="35" cy="20" r="5" fill="#6272a4" opacity="0.5" />
  <circle cx="50" cy="20" r="5" fill="#6272a4" opacity="0.3" />
  
  <!-- Terminal Window Label -->
  <text x="80" y="24" class="term-text term-dim" font-size="11">thiago@mainframe:~</text>

  <!-- Grid Background inside Terminal -->
  <g>
    <!-- Vertical Grid Lines -->
    <line x1="100" y1="40" x2="100" y2="260" class="grid-line" />
    <line x1="200" y1="40" x2="200" y2="260" class="grid-line" />
    <line x1="300" y1="40" x2="300" y2="260" class="grid-line" />
    <line x1="400" y1="40" x2="400" y2="260" class="grid-line" />
    <line x1="500" y1="40" x2="500" y2="260" class="grid-line" />
    <line x1="600" y1="40" x2="600" y2="260" class="grid-line" />
    <line x1="700" y1="40" x2="700" y2="260" class="grid-line" />
    <line x1="800" y1="40" x2="800" y2="260" class="grid-line" />
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="80" x2="850" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="850" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="850" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="850" y2="200" class="grid-line" />
    <line x1="0" y1="240" x2="850" y2="240" class="grid-line" />
  </g>

  <!-- Visualizer Core (Left Side) -->
  <g>
    <!-- Outer Ring -->
    <circle cx="150" cy="140" r="60" fill="none" stroke="#ff2a5f" stroke-width="1" opacity="0.2" />
    
    <!-- Rotating Dash Ring -->
    <circle cx="150" cy="140" r="50" fill="none" stroke="#ff2a5f" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 150 140" to="360 150 140" dur="25s" repeatCount="indefinite" />
    </circle>
    
    <!-- Outer solid detail ring -->
    <circle cx="150" cy="140" r="40" fill="none" stroke="#ff2a5f" stroke-width="0.5" opacity="0.4" />
    
    <!-- Pulsing Center Core -->
    <circle cx="150" cy="140" r="24" fill="url(#neon-grad)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.95;0.6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="r" values="22;25;22" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Crosshairs & Coordinate Lines -->
    <line x1="150" y1="65" x2="150" y2="215" stroke="#ff2a5f" stroke-width="0.5" opacity="0.3" />
    <line x1="75" y1="140" x2="225" y2="140" stroke="#ff2a5f" stroke-width="0.5" opacity="0.3" />
    
    <!-- Center Dot -->
    <circle cx="150" cy="140" r="3" fill="#e2e8f0" />
  </g>

  <!-- Content Section (Right Side) -->
  <g transform="translate(260, 70)">
    <!-- Main Title -->
    <text x="0" y="20" class="term-title">THIAGO ARAÚJO</text>
    <text x="160" y="20" class="term-text term-dim" font-size="11">// FULL-STACK ARCHITECT</text>
    
    <!-- Status & Details -->
    <g transform="translate(0, 45)">
      <!-- System Loading Status -->
      <text x="0" y="10" class="term-text term-accent line-1">> INITIALIZING SECURE MAIN_FRAME...</text>
      
      <!-- Details -->
      <text x="0" y="32" class="term-text line-2"><tspan class="term-dim">sys.status</tspan> = <tspan class="term-string">"ACTIVE"</tspan></text>
      <text x="0" y="54" class="term-text line-3"><tspan class="term-dim">sys.core  </tspan> = [<tspan class="term-accent">"React"</tspan>, <tspan class="term-accent">"Node.js"</tspan>, <tspan class="term-accent">"TypeScript"</tspan>, <tspan class="term-accent">"Python"</tspan>]</text>
      <text x="0" y="76" class="term-text line-4"><tspan class="term-dim">sys.focus </tspan> = <tspan class="term-keyword">const</tspan> { <tspan class="term-accent">Scale</tspan>, <tspan class="term-accent">Performance</tspan>, <tspan class="term-accent">UX</tspan> }</text>
      <text x="0" y="98" class="term-text line-5"><tspan class="term-dim">sys.locate</tspan> = <tspan class="term-string">"Brazil/SP"</tspan></text>
      
      <!-- Command Prompt with Blinking Cursor -->
      <text x="0" y="125" class="term-text line-prompt" font-weight="bold" clip-path="url(#clip-prompt)">thiago@mainframe:~$ <tspan class="term-dim">run --profile</tspan><tspan class="cursor-blink" fill="#ff2a5f">█</tspan></text>
    </g>
  </g>
</svg>
